services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seatlock
      POSTGRES_PASSWORD: seatlock
      POSTGRES_DB: seatlock
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatlock -d seatlock"]
      interval: 2s
      timeout: 2s
      retries: 20
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://seatlock:seatlock@db:5432/seatlock
      JWT_SECRET: local-development-secret-change-me
      INVITE_SECRET: local-invite-secret-change-me
      ALLOW_DEMO_AUTH: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - api
    ports:
      - "5173:5173"
